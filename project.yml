name: Dice
options:
  bundleIdPrefix: dev.ansel.dice
  # Base language; Simplified Chinese comes from Shared/Localizable.xcstrings.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 72W9R47VF7
packages:
  DiceKit:
    path: DiceKit
targets:
  DiceApp:
    type: application
    platform: iOS
    sources: [DiceApp, Shared]
    info:
      path: DiceApp/Info.plist
      properties:
        CFBundleDisplayName: DND Dice
        UILaunchScreen: {}
        # Only uses encryption built into iOS, so App Store Connect does not ask on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ansel.dice
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The roller is laid out for portrait; landscape left too little height for the panel.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # App Store Connect requires all orientations on iPad (multitasking); iPad has room for the panel.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: DiceMessages
      - package: DiceKit
    scheme:
      testTargets:
        - DiceMessagesTests
  DiceMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: DiceMessages
        excludes: [Info.plist]
      - Shared
    info:
      path: DiceMessages/Info.plist
      properties:
        CFBundleDisplayName: DND Dice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        # Was dev.ansel.dice.messages: Messages on the developer's iPhone cached a blank icon for that ID
        # and would not refresh it. A new ID shows the icon; changed before the first public release.
        PRODUCT_BUNDLE_IDENTIFIER: dev.ansel.dice.imessage
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    dependencies:
      - package: DiceKit
  DiceMessagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DiceMessagesTests
      - DiceMessages/Screen.swift
      - DiceMessages/MessageFactory.swift
      - DiceMessages/RevealState.swift
      - Shared/PanelModel.swift
      - Shared/SpecStore.swift
      - Shared/BonusPreset.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DiceApp
      - package: DiceKit
