name: Dice
options:
  bundleIdPrefix: dev.ansel.dice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  DiceKit:
    path: DiceKit
targets:
  DiceApp:
    type: application
    platform: iOS
    sources: [DiceApp, Shared]
    info:
      path: DiceApp/Info.plist
      properties:
        CFBundleDisplayName: 骰子
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ansel.dice
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DiceMessages
      - package: DiceKit
    scheme:
      testTargets:
        - DiceMessagesTests
  DiceMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: DiceMessages
        excludes: [Info.plist]
      - Shared
    info:
      path: DiceMessages/Info.plist
      properties:
        CFBundleDisplayName: 骰子
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ansel.dice.messages
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    dependencies:
      - package: DiceKit
  DiceMessagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DiceMessagesTests
      - DiceMessages/Screen.swift
      - DiceMessages/MessageFactory.swift
      - DiceMessages/RevealState.swift
      - Shared/PanelModel.swift
      - Shared/SpecStore.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DiceApp
      - package: DiceKit
